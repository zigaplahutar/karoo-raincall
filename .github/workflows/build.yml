name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-version is set explicitly so the repo needs no committed wrapper jar.
      # Everything is built in CI, so there is no local Gradle install to rely on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The maths in TileMath and DbzPalette is where a silent wrong answer would do
      # the most damage, so tests run before anything is built or published.
      - name: Run unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # A classic PAT with read:packages, stored as a repo secret. The built-in
          # GITHUB_TOKEN cannot read packages from another org's repository.
          GITHUB_TOKEN: ${{ secrets.KAROO_EXT_TOKEN }}
        run: gradle test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-version is set explicitly so the repo needs no committed wrapper jar.
      # Everything is built in CI, so there is no local Gradle install to rely on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KAROO_EXT_TOKEN }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raincall-debug
          path: app/build/outputs/apk/debug/*.apk
