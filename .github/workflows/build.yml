name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# contents: write so a tag build can create the GitHub release the Karoo installs from.
# packages: read for the karoo-ext dependency.
permissions:
  contents: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-version is set explicitly so the repo needs no committed wrapper jar.
      # Everything is built in CI, so there is no local Gradle install to rely on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The maths in TileMath and DbzPalette is where a silent wrong answer would do
      # the most damage, so tests run before anything is built or published.
      - name: Run unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # A classic PAT with read:packages, stored as a repo secret. The built-in
          # GITHUB_TOKEN cannot read packages from another org's repository.
          GITHUB_TOKEN: ${{ secrets.KAROO_EXT_TOKEN }}
        run: gradle test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-version is set explicitly so the repo needs no committed wrapper jar.
      # Everything is built in CI, so there is no local Gradle install to rely on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Tests run again here rather than being taken on trust from the job above: this
      # is the job whose output is published, and a release built from untested code is
      # the one thing this workflow exists to prevent.
      - name: Run tests and build the release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KAROO_EXT_TOKEN }}
        run: gradle test assembleRelease --stacktrace

      # The Karoo downloads a fixed filename from the release, so the APK is renamed
      # from its Gradle output name and the manifest is copied alongside it.
      - name: Assemble the release payload
        run: |
          set -euo pipefail
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "no release APK was produced" >&2
            exit 1
          fi
          cp "$apk" out/raincall.apk
          cp app/manifest.json out/manifest.json
          ls -l out

      # An unsigned APK will not install on the Karoo, and the failure appears only on
      # the device. Checking here turns that into a build failure instead.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs out/raincall.apk

      - name: Upload APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: raincall-release
          path: out/

      # Only a tag publishes. A push to main builds and tests the same way but leaves
      # the releases page alone.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/raincall.apk
            out/manifest.json
